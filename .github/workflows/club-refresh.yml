name: Club refresh

# PIPE-08: títulos, rivalidades, ficha e imágenes del club salen del cron de
# datos. BDFutbol no necesita 144 pasadas al día: una semanal basta para un
# histórico que solo cambia cuando se juega un cruce o se gana un título.
on:
  schedule:
    # Lunes 07:00 UTC, antes de la ventana de partido del fin de semana.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Reescribir los documentos aunque el contenido no cambie"
        type: boolean
        default: false

permissions:
  contents: write

# Un solo grupo para Data, News, Rivals y Club: solo uno escribe `main` a la vez
# (PIPE-06). El despliegue se serializa aparte en `pages-deploy`.
concurrency:
  group: main-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      titles: ${{ steps.titles.outcome }}
      rivalries: ${{ steps.rivalries.outcome }}
      images: ${{ steps.images.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/pyproject.toml
      - run: pip install -e scripts
      - name: Restaurar caché de BDFutbol y medios
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/enrich
            data/raw/club-media
          key: club-cache-${{ github.run_id }}
          restore-keys: |
            club-cache-
      # PIPE-07: un 403/429 o un HTML cambiado dejan el paso en rojo y una
      # anotación, pero no bloquean la ficha local ni las imágenes ya publicadas.
      # El job club-alert convierte ese rojo en run no-verde al final.
      - id: titles
        name: Títulos del club (propuesta fuera del árbol publicado)
        continue-on-error: true
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          python -m depor_hub.cli club titles \
            --proposal data/raw/titles.proposed.yml \
            ${{ inputs.force && '--force' || '' }}
      - id: rivalries
        name: Rivalidades del club (balance BDFutbol)
        continue-on-error: true
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          python -m depor_hub.cli club rivalries \
            --raw data/raw \
            ${{ inputs.force && '--force' || '' }}
      - name: Publicar la ficha del club
        # Solo YAML curado + títulos/rivalidades canónicos: no toca la red.
        run: python -m depor_hub.cli club ${{ inputs.force && '--force' || '' }}
      - id: images
        name: Imágenes del club (solo si faltan)
        continue-on-error: true
        run: |
          if [ -d data/public/v1/img/club ]; then
            python -m depor_hub.cli club-images --offline ${{ inputs.force && '--force' || '' }}
          else
            python -m depor_hub.cli club-images ${{ inputs.force && '--force' || '' }}
          fi
      - name: Guardar caché de BDFutbol y medios
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/enrich
            data/raw/club-media
          key: club-cache-${{ github.run_id }}
      - name: Detectar cambios en data/public
        id: dirty
        run: |
          git add -A data/public
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validar todos los datos antes de publicar
        if: steps.dirty.outputs.changed == 'true'
        run: python -m depor_hub.cli validate --data data/public/v1
      - name: Commit de los datos
        id: commit
        run: |
          git config user.name "depor-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/public
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data(club): refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          pushed=false
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              sleep "$((attempt * 2))"
              continue
            fi
            if git push origin HEAD:main; then pushed=true; break; fi
            sleep "$((attempt * 2))"
          done
          [ "$pushed" = true ]
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Un único workflow reutilizable despliega Pages (PIPE-16): un deploy por
  # commit, no por run.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/publish.yml

  # PIPE-07: si BDFutbol falló o devolvió un HTML que ya no se entiende, el run
  # termina en rojo aunque la ficha local se haya publicado.
  club-alert:
    needs: refresh
    if: |
      needs.refresh.outputs.titles == 'failure' ||
      needs.refresh.outputs.rivalries == 'failure' ||
      needs.refresh.outputs.images == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Señalar el fallo de BDFutbol o de las imágenes
        run: |
          echo "::error::Club refresh falló en títulos, rivalidades o imágenes; revisa las anotaciones del job refresh."
          exit 1
