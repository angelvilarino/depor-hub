name: Publish Pages

# Workflow reutilizable: una sola copia del bloque de despliegue para Data,
# News y Rivals (PIPE-16). Cada llamada sube el `data/public` completo
# desde un checkout nuevo de `main`, así Pages publica exactamente el commit
# que acaba de quedar en el repositorio.
on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez. Si dos workflows terminan seguidos, el segundo espera y
# publica el snapshot más reciente; nunca se pisan.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # deploy-pages sustituye Pages entero: siempre subimos el snapshot completo.
          path: data/public
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
