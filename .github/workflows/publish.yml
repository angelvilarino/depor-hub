name: Publish Pages

# Workflow reutilizable: una sola copia del bloque de despliegue para Data,
# News y Rivals (PIPE-16). Cada llamada sube el `data/public` completo
# desde un checkout nuevo de `main`, así Pages publica exactamente el commit
# que acaba de quedar en el repositorio.
on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez. Si dos workflows terminan seguidos, el segundo espera y
# publica el snapshot más reciente; nunca se pisan.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          # deploy-pages sustituye Pages entero: siempre subimos el snapshot completo.
          path: data/public
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
