name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - name: Expo doctor (informativo)
        run: npx expo-doctor
        continue-on-error: true
      - name: Comprobar versiones recomendadas de Expo (informativo)
        run: npx expo install --check
        continue-on-error: true
      - name: Auditoría de dependencias de producción (informativa)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/pyproject.toml
      - run: pip install -e "scripts[dev]"
      - run: pip install pip-audit
      - run: ruff check scripts
      - run: pytest scripts
      - name: Auditoría Python (informativa)
        run: pip-audit
        continue-on-error: true
      - name: Validar JSON publicados con Pydantic
        run: python -m depor_hub.cli validate --data data/public/v1
      - name: Los esquemas JSON publicados coinciden con los modelos
        run: |
          python -m depor_hub.cli schemas
          git diff --exit-code packages/schemas
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Escaneo bloqueante de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
