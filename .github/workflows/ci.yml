name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run format:check
      - name: Licencias de terceros al día
        run: npm run licenses && git diff --exit-code apps/mobile/src/data/licenses.json
      - name: Auditoría de dependencias (bloqueante)
        run: npm run audit
      - name: Expo doctor (informativo)
        run: npx expo-doctor
        continue-on-error: true
      - name: Comprobar versiones recomendadas de Expo (informativo)
        run: npx expo install --check
        continue-on-error: true
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/live-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/live-proxy/package-lock.json
      - run: npm ci
      - run: npm test
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.lock
      - name: Dependencias Python fijadas
        run: pip install -r scripts/requirements.lock
      - run: pip install -e "scripts" --no-deps
      - run: pip install pip-audit
      - run: ruff check scripts
      - run: pytest scripts
      - name: Auditoría Python (informativa)
        run: pip-audit
        continue-on-error: true
      - name: Validar JSON publicados con Pydantic
        run: python -m depor_hub.cli validate --data data/public/v1
      - name: Smoke del contrato publicado
        run: python -m depor_hub.cli smoke --data data/public/v1
      - name: Los esquemas JSON publicados coinciden con los modelos
        run: |
          python -m depor_hub.cli schemas
          git diff --exit-code packages/schemas
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Escaneo bloqueante de secretos
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
