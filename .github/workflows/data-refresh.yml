name: Data refresh
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publicar aunque no haya cambios"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/pyproject.toml
      - run: pip install -e scripts
      - id: ingest
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python -m depor_hub.cli ingest ${{ inputs.force && '--force' || '' }}
      - name: Commit de los datos
        if: steps.ingest.outputs.changed == 'true'
        run: |
          git config user.name "depor-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nada que commitear"
          git push
      - uses: actions/configure-pages@v5
        if: steps.ingest.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.ingest.outputs.changed == 'true'
        with:
          path: data/public
      - id: deploy
        if: steps.ingest.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
