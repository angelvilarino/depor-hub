name: Data refresh
on:
  schedule:
    # Una pasada diaria. Los días de partido, `data-matchday.yml` lanza este
    # workflow cada 10 min dentro de la ventana del encuentro.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publicar aunque no haya cambios y saltarse --if-due"
        type: boolean
        default: false

permissions:
  contents: write

# Un solo grupo para Data, News y Rivals: solo uno escribe `main` a la vez
# (PIPE-06). El despliegue se serializa aparte en `pages-deploy`.
concurrency:
  group: main-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      bdfutbol: ${{ steps.match-details.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/pyproject.toml
      - run: pip install -e scripts
      - name: Restaurar el último refresco
        uses: actions/cache/restore@v4
        with:
          path: data/raw/ingest_state.json
          key: ingest-state-${{ github.run_id }}
          restore-keys: |
            ingest-state-
      - name: Forzar una pasada diaria sin duplicar commits
        # El cron diario siempre consulta la red, pero `write_if_changed` sigue
        # evitando el commit si el contenido no ha cambiado. Los disparos del
        # supervisor de partido no borran el estado.
        if: github.event_name == 'schedule'
        run: rm -f data/raw/ingest_state.json
      - id: ingest
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python -m depor_hub.cli ingest --if-due ${{ inputs.force && '--force' || '' }}
      # PIPE-11: snapshots y match-details solo trabajan cuando la ingesta ha
      # hecho una pasada real. Si no tocaba, no hay nada nuevo que congelar.
      - name: Congelar snapshots de partidos terminados
        if: steps.ingest.outputs.refreshed == 'true'
        run: python -m depor_hub.cli snapshots
      - id: match-details
        name: Publicar alineaciones y eventos de partidos terminados
        if: steps.ingest.outputs.refreshed == 'true'
        # PIPE-04: un 403/429 o un partido terminado sin emparejar deja el paso
        # en rojo y una anotación, pero no bloquea la publicación del resto.
        # El job bdfutbol-alert convierte ese rojo en run no-verde al final.
        continue-on-error: true
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python -m depor_hub.cli match-details --strict
      - name: Guardar el último refresco
        if: steps.ingest.outputs.refreshed == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/raw/ingest_state.json
          key: ingest-state-${{ github.run_id }}
      - name: Detectar cambios en data/public
        id: dirty
        run: |
          git add -A data/public
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # PIPE-11: validar 3,9 MB solo cuando hay algo que publicar. La validación
      # completa sigue en CI y en los workflows que sí escriben siempre.
      - name: Validar todos los datos antes de publicar
        if: steps.dirty.outputs.changed == 'true'
        run: python -m depor_hub.cli validate --data data/public/v1
      - name: Commit de los datos
        id: commit
        run: |
          git config user.name "depor-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/public
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          pushed=false
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              sleep "$((attempt * 2))"
              continue
            fi
            if git push origin HEAD:main; then pushed=true; break; fi
            sleep "$((attempt * 2))"
          done
          [ "$pushed" = true ]
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Un único workflow reutilizable despliega Pages (PIPE-16). Se ejecuta solo si
  # esta pasada ha dejado un commit: un deploy por commit, no por run.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/publish.yml

  # PIPE-04: si había partidos terminados y BDFutbol falló o no los emparejó,
  # el run termina en rojo. Va en un job aparte para que deploy siga publicando
  # fixtures, snapshots y club (no depende de este job).
  bdfutbol-alert:
    needs: refresh
    if: needs.refresh.outputs.bdfutbol == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Señalar el fallo de BDFutbol
        run: |
          echo "::error::BDFutbol falló o no emparejó algún partido terminado; revisa las anotaciones del job refresh."
          exit 1
