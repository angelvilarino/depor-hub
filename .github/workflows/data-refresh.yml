name: Data refresh
on:
  schedule:
    # Cada 10 min: --if-due decide 10 min en ventana de partido y 60 min fuera.
    # GitHub Actions no garantiza puntualidad y puede retrasarse; el estado real del
    # último refresco vive en la caché.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publicar aunque no haya cambios y saltarse --if-due"
        type: boolean
        default: false

permissions:
  contents: write

# Los dos workflows de datos comparten grupo: nunca publican a la vez. Si uno está en
# curso, el otro espera en cola (cancel-in-progress: false) en vez de pisar el commit.
concurrency:
  group: data-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      bdfutbol: ${{ steps.match-details.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/pyproject.toml
      - run: pip install -e scripts
      - name: Restaurar el último refresco
        uses: actions/cache/restore@v4
        with:
          path: data/raw/ingest_state.json
          key: ingest-state-${{ github.run_id }}
          restore-keys: |
            ingest-state-
      - id: ingest
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python -m depor_hub.cli ingest --if-due ${{ inputs.force && '--force' || '' }}
      - name: Congelar snapshots de partidos terminados
        run: python -m depor_hub.cli snapshots
      - id: match-details
        name: Publicar alineaciones y eventos de partidos terminados
        # PIPE-04: un 403/429 o un partido terminado sin emparejar deja el paso
        # en rojo y una anotación, pero no bloquea la publicación del resto.
        # El job bdfutbol-alert convierte ese rojo en run no-verde al final.
        continue-on-error: true
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python -m depor_hub.cli match-details --strict
      - name: Publicar la ficha del club
        run: python -m depor_hub.cli club
      - name: Imágenes del club (solo si faltan)
        run: |
          if [ -d data/public/v1/img/club ]; then
            python -m depor_hub.cli club-images --offline
          else
            python -m depor_hub.cli club-images
          fi
      - name: Títulos del club (propuesta fuera del árbol publicado)
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python -m depor_hub.cli club titles --proposal data/raw/titles.proposed.yml
      - name: Rivalidades del club (balance BDFutbol)
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python -m depor_hub.cli club rivalries
      - name: Guardar el último refresco
        if: steps.ingest.outputs.refreshed == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/raw/ingest_state.json
          key: ingest-state-${{ github.run_id }}
      - name: Validar todos los datos antes de publicar
        run: python -m depor_hub.cli validate --data data/public/v1
      - name: Commit de los datos
        id: commit
        run: |
          git config user.name "depor-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/public
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          pushed=false
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              sleep "$((attempt * 2))"
              continue
            fi
            if git push origin HEAD:main; then pushed=true; break; fi
            sleep "$((attempt * 2))"
          done
          [ "$pushed" = true ]
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Se despliega desde un checkout nuevo de main: así Pages publica exactamente el
  # commit que acaba de quedar en el repositorio, con data/public completo.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # deploy-pages sustituye Pages entero: siempre subimos el snapshot completo.
          path: data/public
      - id: deploy
        uses: actions/deploy-pages@v4

  # PIPE-04: si había partidos terminados y BDFutbol falló o no los emparejó,
  # el run termina en rojo. Va en un job aparte para que deploy siga publicando
  # fixtures, snapshots y club (no depende de este job).
  bdfutbol-alert:
    needs: refresh
    if: needs.refresh.outputs.bdfutbol == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Señalar el fallo de BDFutbol
        run: |
          echo "::error::BDFutbol falló o no emparejó algún partido terminado; revisa las anotaciones del job refresh."
          exit 1
