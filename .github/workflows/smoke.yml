name: Smoke Pages

on:
  workflow_run:
    workflows: ['Data refresh', 'News refresh', 'Rivals refresh']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Un solo smoke a la vez: si tres workflows terminan seguidos, basta con
# comprobar el estado final de Pages una vez.
concurrency:
  group: smoke-pages
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/pyproject.toml
      - run: pip install -e scripts
      - name: Comprobar los documentos publicados
        run: python -m depor_hub.cli smoke --base-url https://angelvilarino.github.io/depor-hub
