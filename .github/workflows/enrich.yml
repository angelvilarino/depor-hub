name: Enrich proposal
on:
  workflow_dispatch:
    inputs:
      min_confidence:
        description: 'Confianza mínima que se aplicaría (el artefacto siempre incluye todo)'
        type: choice
        options:
          - single_source
          - cross_checked
          - verified
        default: single_source

permissions:
  contents: read

concurrency:
  group: enrich-proposal
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/pyproject.toml
      - run: pip install -e scripts
      - name: Generar propuesta (sin aplicar ni commitear)
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          python -m depor_hub.cli enrich --min-confidence "${{ inputs.min_confidence }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: squad-enrich-proposal
          path: data/manual/squad_enrich.proposed.yml
          if-no-files-found: error
          retention-days: 14
