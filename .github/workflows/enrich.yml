name: Enrich proposal
on:
  workflow_dispatch:
    inputs:
      min_confidence:
        description: 'Confianza mínima que se aplicaría (el artefacto siempre incluye todo)'
        type: choice
        options:
          - single_source
          - cross_checked
          - verified
        default: single_source

permissions:
  contents: read

concurrency:
  group: enrich-proposal
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/pyproject.toml
      - run: pip install -e scripts
      - name: Generar propuesta (sin aplicar ni commitear)
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          python -m depor_hub.cli enrich --min-confidence "${{ inputs.min_confidence }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: squad-enrich-proposal
          path: data/manual/squad_enrich.proposed.yml
          if-no-files-found: error
          retention-days: 14
