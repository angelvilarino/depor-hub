name: Health

on:
  schedule:
    # Una vez al día, después de la pasada diaria de datos. Health es barato,
    # pero no necesita más frecuencia: el diagnóstico vive en la rama status.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# La rama status solo la escribe este workflow. No compite con data-publish:
# así un refresco lento no retrasa el diagnóstico ni al contrario.
concurrency:
  group: status-publish
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/pyproject.toml
      - run: pip install -e scripts
      - name: Leer los últimos runs de cada workflow
        # Una ventana global de 50 runs oculta Rivals (semanal) y deja el
        # semáforo en rojo para siempre (PIPE-05). Cada workflow se consulta
        # por separado para que tenga su propia ventana.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/runs"
          for workflow in data-refresh.yml news-refresh.yml rivals-refresh.yml health.yml ci.yml; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?per_page=20&status=completed" \
              -o "$RUNNER_TEMP/runs/$workflow.json"
          done
      - name: Construir status.json
        # --soft publica también un estado rojo: el diagnóstico no debe desaparecer
        # justo cuando algo falla.
        run: |
          python -m depor_hub.cli status \
            --data data/public/v1 \
            --runs-dir "$RUNNER_TEMP/runs" \
            --out "$RUNNER_TEMP/status.json" \
            --commit "$GITHUB_SHA" \
            --soft
      - name: Publicar en la rama status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "depor-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan status-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/status.json" status.json
          git add status.json
          git commit -m "status: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin HEAD:status
      - name: Poner el run en rojo si el semáforo está en rojo
        # PIPE-12: antes el `--soft` escribía ok=false y el job seguía verde, así
        # que nadie se enteraba. El estado se publica primero (el diagnóstico no
        # debe desaparecer) y después el run refleja el fallo. Health no cuenta
        # su propio run en `ok` (ver cmd_status) para no crear un bucle rojo.
        run: |
          ok=$(python -c "import json,sys; print('true' if json.load(open(sys.argv[1]))['ok'] else 'false')" "$RUNNER_TEMP/status.json")
          if [ "$ok" != "true" ]; then
            echo "::error::status.json tiene ok=false: algún documento requerido falta o un workflow está fallando/obsoleto."
            exit 1
          fi
