name: Rivals refresh
on:
  schedule:
    # Lunes por la noche, cuando ya ha terminado la jornada del fin de semana.
    # BDFutbol solo cambia el histórico cuando se juega un cruce.
    - cron: "0 22 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Reescribir rivals.json aunque el contenido no cambie"
        type: boolean
        default: false

permissions:
  contents: write

# Un solo grupo para Data, News y Rivals: solo uno escribe `main` a la vez
# (PIPE-06). El despliegue se serializa aparte en `pages-deploy`.
concurrency:
  group: main-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/pyproject.toml
      - run: pip install -e scripts
      - name: Restaurar caché de BDFutbol
        uses: actions/cache/restore@v4
        with:
          path: data/raw/enrich/h2h
          key: h2h-cache-${{ github.run_id }}
          restore-keys: |
            h2h-cache-
      - name: Histórico y contexto de los rivales
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python -m depor_hub.cli rivals --interval 1 ${{ inputs.force && '--force' || '' }}
      - name: Validar todos los datos antes de publicar
        run: python -m depor_hub.cli validate --data data/public/v1
      - name: Guardar caché de BDFutbol
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/enrich/h2h
          key: h2h-cache-${{ github.run_id }}
      - name: Commit de los datos
        id: commit
        run: |
          git config user.name "depor-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/public
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data(rivals): refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          pushed=false
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              sleep "$((attempt * 2))"
              continue
            fi
            if git push origin HEAD:main; then pushed=true; break; fi
            sleep "$((attempt * 2))"
          done
          [ "$pushed" = true ]
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Un único workflow reutilizable despliega Pages (PIPE-16): un deploy por
  # commit, no por run.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/publish.yml
