name: News refresh
on:
  schedule:
    # Cada 30 min. La ingesta es idempotente y solo escribe si cambia el hash.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorar ETag/If-Modified-Since y publicar aunque no cambie el hash"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Mismo grupo que Data refresh (ADR 0016): ambos escriben en main y despliegan Pages.
# Nunca se cancelan entre sí; el segundo espera y parte del último commit.
concurrency:
  group: data-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/pyproject.toml
      - run: pip install -e scripts
      - name: Restaurar caché de feeds y rotación
        uses: actions/cache/restore@v4
        with:
          path: data/raw/news
          key: news-cache-${{ github.run_id }}
          restore-keys: |
            news-cache-
      - name: Ingesta de noticias y vídeos
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python -m depor_hub.cli news ingest ${{ inputs.force && '--force' || '' }}
      - name: Guardar caché de feeds y rotación
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/news
          key: news-cache-${{ github.run_id }}
      - name: Commit de los datos
        id: commit
        run: |
          git config user.name "depor-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/public
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data(news): refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: data/public
      - id: deploy
        uses: actions/deploy-pages@v4
