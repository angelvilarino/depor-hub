name: News refresh
on:
  schedule:
    # Cada 30 min: cobertura útil de titulares; el pipeline es idempotente.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorar ETag/If-Modified-Since y publicar aunque no cambie el hash"
        type: boolean
        default: false

permissions:
  contents: write

# Un solo grupo para Data, News, Rivals y Club: solo uno escribe `main` a la vez
# (PIPE-06). El rebase de 5 intentos queda como red de seguridad, pero ya no hay
# dos workflows compitiendo por el mismo push.
concurrency:
  group: main-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/pyproject.toml
      - run: pip install -e scripts
      - name: Restaurar caché de feeds y rotación
        uses: actions/cache/restore@v4
        with:
          path: data/raw/news
          key: news-cache-${{ github.run_id }}
          restore-keys: |
            news-cache-
      # Si ninguna fuente responde, el comando sale con código 1 y el workflow falla:
      # nunca se publica un news.json vacío ni se pisa el anterior.
      - name: Ingesta de noticias y vídeos
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python -m depor_hub.cli news ${{ inputs.force && '--force' || '' }}
      - name: Validar todos los datos antes de publicar
        run: python -m depor_hub.cli validate --data data/public/v1
      - name: Guardar caché de feeds y rotación
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/news
          key: news-cache-${{ github.run_id }}
      - name: Commit de los datos
        id: commit
        run: |
          git config user.name "depor-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/public
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data(news): refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          pushed=false
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              sleep "$((attempt * 2))"
              continue
            fi
            if git push origin HEAD:main; then pushed=true; break; fi
            sleep "$((attempt * 2))"
          done
          [ "$pushed" = true ]
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Un único workflow reutilizable despliega Pages (PIPE-16): un deploy por
  # commit, no por run.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/publish.yml
