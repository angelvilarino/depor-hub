    name: La Voz de Galicia · Deportes
    kind: local
    url: https://www.lavozdegalicia.es/deportes/index.xml
    media_url: https://www.lavozdegalicia.es/deportes/
    language: es
    weight: 70
    keyword_filter: true
    enabled: true

