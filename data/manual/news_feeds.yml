# Catálogo de feeds de noticias (H6, ADR 0016).
#
# `keyword_filter: true` significa que el feed es general y hay que aplicar el filtro de
# relevancia del Depor. `false` se usa solo cuando el feed ya es específico del club o la
# consulta de Google News es suficientemente concreta.
#
# `enabled: false` documenta una fuente descartada en la auditoría. No se reintenta a ciegas:
# el motivo queda en `note` y en docs/sources.md. `news audit --write-docs` puede actualizar
# este fichero, pero la revisión final es manual.
feeds:
