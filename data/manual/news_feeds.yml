# Catálogo curado de noticias (ADR 0018).
#
# `priority`: menor = más prioritaria para ser representante de un clúster.
# `depor_specific`: el feed ya está centrado en el Depor; se le exige menos señal,
# pero el filtro sigue descartando noticias de otros clubes.
# `enabled: false` documenta una fuente descartada y su motivo.

feeds:
  - id: youtube-club
    name: RC Deportivo (YouTube)
    group: club
    priority: 5
    feedUrl: https://www.youtube.com/feeds/videos.xml?channel_id=UCY2s1XaPzO60Hu6M_YZCTgA
    homepage: https://www.youtube.com/@rcdeportivo
    kind: video
    enabled: true
    depor_specific: true
    note: "Canal oficial. Se mantiene el RSS público por decisión expresa del responsable del proyecto (ADR 0018); YouTube lo desaconseja en robots.txt."

  - id: riazor
    name: Riazor.org
    group: galicia
    priority: 10
    feedUrl: https://www.riazor.org/feed/
    homepage: https://www.riazor.org/
    kind: article
    enabled: true
    depor_specific: true
    note: "Medio independiente centrado en el Depor. robots.txt permite /feed/$."

  - id: dxt-campeon
