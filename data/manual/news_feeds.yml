  # Google News: consultas fijas. Son la vía más barata para ampliar cobertura y también
  # el respaldo de los medios que bloquean el RSS directo. No se resuelve la redirección
  # si exige scraping: se guarda la URL de Google News tal cual.
  - id: google-news-depor
    name: Google News · Deportivo de La Coruña
    kind: agregador
    url: https://news.google.com/rss/search?q=%22Deportivo%20de%20La%20Coru%C3%B1a%22&hl=es&gl=ES&ceid=ES:es
