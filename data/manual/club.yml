# Datos curados del club (H7, ADR 0025).
#
# Este fichero es la fuente de `club.json`. La procedencia y la confianza viven
# aquí (comentarios y docs/sources.md), nunca en el contrato público: la app no
# muestra fuentes ni insignias de verificación. Lo que no esté documentado se
# deja en `null`; no se inventan dorsales, fechas, patrocinadores ni cifras.
#
# Las letras de los himnos NO se copian aquí: viven en data/manual/himnos/<id>.txt.
# En «Voa» solo se publica el bloque posterior a la línea `Letra`; el resto del
# fichero (créditos) se refleja en `credits`.
#
# Capacidad de Riazor: 32.490 gradas + 141 palco de honor + 385 palcos VIP +
# 113 Área 1906 + 96 medios = 33.225. La suma se valida en el contrato.

