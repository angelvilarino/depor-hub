training_center:
  name: Dépor Training Center
  location: Abegondo, A Coruña
  description: >-
    Proyecto de ciudad deportiva del club en Abegondo, concebido como «Onde nace
    o futuro» para conectar la cantera con el primer equipo.
  facilities:
    - 140.000 m² de superficie
    - 8 campos con las dimensiones de Riazor
    - 3 campos de calentamiento
    - Diseño del estudio Populous
    - Energías renovables y reutilización de agua
  coordinates: null

