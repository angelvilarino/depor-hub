# Datos curados del club (H7, ADR 0025).
#
# Este fichero es la fuente de `club.json`. La procedencia y la confianza viven
# aquí (comentarios y docs/sources.md), nunca en el contrato público: la app no
# muestra fuentes ni insignias de verificación. Lo que no esté documentado se
# deja en `null`; no se inventan dorsales, fechas, patrocinadores ni cifras.
#
# Las letras de los himnos NO se copian aquí: viven en data/manual/himnos/<id>.txt.
# En «Voa» solo se publica el bloque posterior a la línea `Letra`; el resto del
# fichero (créditos) se refleja en `credits`.
#
# El club publica 32.490 espectadores, todos sentados. También desglosa
# localidades de palco/VIP/Área 1906 y puestos de medios, pero no aclara si se
# suman al aforo; no se agregan ni se presentan como zonas independientes.

identity:
  official_name: Real Club Deportivo de La Coruña, S.A.D.
  short_name: RC Deportivo
  founded_year: 1906
  city: A Coruña
  country: España
  colors:
    - blanco
    - azul
  nicknames:
    - Dépor
    - Súper Dépor
    - Blanquiazul
    - Herculinos
    - Los Turcos
  motto: null
  president: Juan Carlos Escotet Rodríguez
  entity: S.A.D.
  headquarters: C/ Manuel Murguía, s/n, 15011 A Coruña
  website: https://www.rcdeportivo.es
  contact:
    email: deportivo@rcdeportivo.es
    phone: (+34) 981 259 500
    address: C/ Manuel Murguía, s/n, 15011 A Coruña

