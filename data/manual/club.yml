      es el partido más repetido y tenso del fútbol gallego.
    since_year: 1923

facts:
  - Fundado en 1906 en la Sala Calvet.
  - Campeón de Liga en la temporada 1999-2000.
  - Disputó cinco Ligas de Campeones consecutivas entre 2001 y 2005.
  - Único club campeón de las tres primeras categorías del fútbol español.
  - Riazor se inauguró el 29 de octubre de 1944.

