crests:
  - id: escudo-1906
    year_from: 1906
    year_to: 1908
    description: Monograma azul con las iniciales «SC» de la Sala Calvet.
    image: img/club/escudos/1906.png
  - id: escudo-1908
    year_from: 1908
    year_to: 1910
    description: El monograma «SC» sobre un medallón circular con marco azul y hebilla.
    image: img/club/escudos/1908.png
  - id: escudo-1910
    year_from: 1910
    year_to: 1911
    description: Escudo con corona y el texto «Deportivo Sala Calvet», con palos y raqueta cruzados.
    image: img/club/escudos/1910.png
  - id: escudo-1911
    year_from: 1911
    year_to: 1912
    description: Se retiran los palos y la raqueta; quedan el medallón y la corona.
    image: img/club/escudos/1911.png
  - id: escudo-1912
    year_from: 1912
    year_to: 1928
    description: Primer escudo con la bandera gallega, la cruz de Santiago y la corona real.
    image: img/club/escudos/1912.png
  - id: escudo-1928
    year_from: 1928
    year_to: 1931
    description: Se reduce la corona superior para equilibrar el conjunto.
    image: img/club/escudos/1928.png
  - id: escudo-1931
    year_from: 1931
    year_to: 1941
    description: Sin coronas durante la Segunda República; trazo más grueso y franja diagonal clara.
    image: img/club/escudos/1931.png
  - id: escudo-1941
    year_from: 1941
    year_to: 1955
    description: Vuelven las dos coronas y se recupera el dorado.
    image: img/club/escudos/1941.png
  - id: escudo-1955
    year_from: 1955
    year_to: 1962
    description: Regresan los perfiles dobles y la franja diagonal azul claro.
    image: img/club/escudos/1955.png
  - id: escudo-1962
    year_from: 1962
    year_to: 1973
    description: Paleta azul en lugar de morada y corona superior más maciza.
    image: img/club/escudos/1962.png
  - id: escudo-1973
    year_from: 1973
    year_to: 1997
    description: Se recupera el escudo clásico de los años cincuenta.
    image: img/club/escudos/1973.png
  - id: escudo-1997
    year_from: 1997
    year_to: 2000
    description: Dorados más amarillos, rojo intenso y detalles turquesa.
    image: img/club/escudos/1997.png
  - id: escudo-2000
    year_from: 2000
    year_to: 2026
    description: Regreso al escudo de doble perfil en oro claro y morado.
    image: img/club/escudos/2000.png
  - id: escudo-2026
    year_from: 2026
    year_to: null
    description: >-
      Actualización con florones, cruz y anillo ajustados y una referencia diagonal
      a la Torre de Hércules.
    image: img/club/escudos/2026.svg

