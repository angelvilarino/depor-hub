stadium:
  name: Estadio Abanca-Riazor
  address: C/ Manuel Murguía, s/n, 15011 A Coruña
  coordinates:
    lat: 43.368667
    lon: -8.417372
  opened_on: "1944-10-29"
  renovations:
    - 1982, ampliación para el Mundial de España
  pitch: Césped natural
  dimensions: 105 x 68 m
  access: Acceso por las puertas del estadio; el museo se visita desde el exterior.
  transport: null
  parking: null
  capacity:
    total: 33225
    breakdown:
      - zone: Gradas
        seats: 32490
      - zone: Palco de honor
        seats: 141
      - zone: Palcos VIP
        seats: 385
      - zone: Área 1906
        seats: 113
      - zone: Medios
        seats: 96
  description: >-
    Estadio municipal inaugurado el 29 de octubre de 1944 y conocido como
    Abanca-Riazor desde 2017. Acoge los partidos del primer equipo y el museo del club.

