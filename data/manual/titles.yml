# Ediciones individuales del palmarés (H1, ampliación aditiva de club.json).
#
# Este fichero alimenta `titles.json`. No se aplica solo: el comando
# `python -m depor_hub.cli club titles` compara BDFutbol con estas ediciones y
# escribe las diferencias en `data/manual/titles.proposed.yml` para revisión.
#
# Cada edición conserva su procedencia y un `status`:
#   verified             = contraste suficiente (2 fuentes u oficial)
#   pending_verification = dato de partida pendiente de contraste
# `confidence` solo puede ser verified/cross_checked/single_source/estimated.
# Lo que no esté documentado se deja en null/[]; no se inventan goleadores,
# alineaciones, marcadores ni árbitros.

