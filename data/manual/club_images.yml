# Fuentes de las imágenes locales del club (ADR 0025).
#
# `python -m depor_hub.cli club-images` descarga cada URL, la normaliza y la
# escribe en data/public/v1/<ruta>. La app solo ve la ruta relativa que declara
# data/manual/club.yml; nunca una URL externa.
#
# Solo se usan imágenes de fuentes que permiten su consulta pública. Si una
# fuente deja de responder, la ruta se mantiene en club.yml y la app muestra el
# marcador de posición correspondiente.

